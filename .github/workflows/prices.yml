name: Relevé quotidien des prix

# Relève les prix de tout le catalogue et les range sur la branche `data`,
# que le site lit ensuite. C'est ce relevé quotidien qui construit l'historique.

on:
  schedule:
    # GitHub saute parfois un déclenchement planifié : deux créneaux par jour.
    # Le relevé remplace la colonne du jour, un second passage ne crée pas de doublon.
    - cron: "17 4 * * *" # 4 h 17 UTC
    - cron: "47 13 * * *" # 13 h 47 UTC, rattrapage
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - src/lib/pricing/**
      - src/lib/snapshot.ts
      - src/lib/tcgdex.ts
      - .github/workflows/prices.yml

permissions:
  contents: write
  issues: write # alerte quand le relevé échoue

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Récupérer la branche data
        run: |
          if git fetch origin data:data 2>/dev/null; then
            git worktree add .data data
          else
            # Premier relevé : la branche n'existe pas encore.
            git worktree add --detach .data
            git -C .data checkout --orphan data
            git -C .data rm -rf --quiet .
          fi

      - name: Relever les prix
        run: node scripts/ingest.ts --out .data
        env:
          # Facultatif : sans ce secret, le relevé se fait sans les annonces de cartes françaises.
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
          # Facultatif : sans ces secrets, le relevé se fait sans eBay.
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}

      - name: Publier
        working-directory: .data
        run: |
          git add -A
          git -c user.name="poketrack-bot" -c user.email="poketrack-bot@users.noreply.github.com" \
            commit --quiet -m "Relevé du $(date -u +%F)" || { echo "Rien à publier"; exit 0; }
          git push origin data

      # Le relevé a réussi : les alertes ouvertes n'ont plus lieu d'être.
      - name: Clore les alertes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --label releve --state open --json number --jq '.[].number' |
            xargs -r -n1 gh issue close --repo "$GITHUB_REPOSITORY" --comment "Relevé du $(date -u +%F) publié."

      # Le relevé a échoué ou a été refusé (trop de cartes illisibles, chute anormale) :
      # rien n'est publié, et un ticket assigné au propriétaire du dépôt le prévient par courriel.
      - name: Alerter
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          msg="Le relevé du $(date -u +%F) a échoué et rien n'a été publié. Journal : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh label create releve --repo "$GITHUB_REPOSITORY" --color B60205 --description "Relevé des prix en panne" --force
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --label releve --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$msg"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Relevé des prix en panne" --label releve --assignee "$GITHUB_REPOSITORY_OWNER" --body "$msg"
          fi
